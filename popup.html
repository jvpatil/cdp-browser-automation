<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;

      --panel-top: #17365C;
      --panel-bottom: #0B2038;

      --button-top: #17375F;
      --button-bottom: #0E2745;
      --button-hover-top: #1C436E;
      --button-hover-bottom: #123050;
      --button-active-top: #102A49;
      --button-active-bottom: #0A1D33;

      --button-border: #526987;
      --button-inner: rgba(255, 255, 255, 0.06);

      --gold: #B69A6B;
      --gold-strong: #C4A66F;

      --text: #F1F2F0;
      --text-muted: #C8CDD3;
      --icon: #E6E4DC;
    }

    body {
      width: 264px;
      margin: 0;
      padding: 7px 8px 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--panel-top), var(--panel-bottom));
      color: var(--text);
    }

    .group {
      margin-top: 7px;
    }

    .group:first-of-type {
      margin-top: 0;
    }

    .group-label {
      margin: 0 1px 5px;
      font-size: 10.5px;
      line-height: 1;
      font-weight: 800;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.095em;
    }

    .actions {
      display: grid;
      gap: 4px;
    }

    #status {
      min-height: 15px;
      margin: 7px 1px 0;
      color: var(--text-muted);
      font-size: 10px;
      line-height: 1.35;
    }

    button {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) 10px;
      align-items: center;
      gap: 7px;
      width: 100%;
      min-height: 36px;
      margin: 0;
      padding: 6px 8px;
      border: 1px solid var(--button-border);
      border-radius: 11px;
      background: linear-gradient(180deg, var(--button-top), var(--button-bottom));
      color: var(--text);
      font: inherit;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 var(--button-inner),
        inset 0 -1px 0 rgba(0, 0, 0, 0.22);
      transition:
        background 120ms ease,
        border-color 120ms ease,
        transform 100ms ease;
    }

    button:hover {
      background: linear-gradient(180deg, var(--button-hover-top), var(--button-hover-bottom));
      border-color: #6D84A2;
    }

    button:active {
      transform: translateY(1px);
      background: linear-gradient(180deg, var(--button-active-top), var(--button-active-bottom));
      box-shadow:
        inset 0 2px 3px rgba(0, 0, 0, 0.24);
    }

    .import-action {
      position: relative;
    }

    .import-action select {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 28px;
      height: 28px;
      opacity: 0;
      cursor: pointer;
    }

    .import-action .import-job-button {
      grid-template-columns: 18px minmax(0, 1fr) auto 10px;
    }

    .schedule-indicator {
      color: var(--gold-strong);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    #importJobsView { display: none; }
    body.import-picker-open > .group,
    body.import-picker-open > #status { display: none; }
    body.import-picker-open #importJobsView { display: block; }
    #exportJobsView { display: none; }
    body.export-picker-open > .group,
    body.export-picker-open > #status { display: none; }
    body.export-picker-open #exportJobsView { display: block; }
    .picker-header { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 8px; }
    .picker-title { margin: 0; font-size: 13px; color: var(--text); }
    .picker-back { width: auto; min-height: 28px; grid-template-columns: 1fr; padding: 5px 8px; font-size: 10px; }
    .picker-search { width: 100%; margin-bottom: 6px; padding: 7px 8px; border: 1px solid var(--button-border); border-radius: 8px; background: #102a49; color: var(--text); font: inherit; font-size: 11px; }
    .picker-tools { display: flex; justify-content: space-between; margin: 0 1px 6px; font-size: 10px; }
    .picker-tools button { width: auto; min-height: auto; grid-template-columns: 1fr; padding: 0; border: 0; background: none; box-shadow: none; color: var(--gold-strong); font-size: 10px; }
    #importJobList { display: grid; gap: 4px; max-height: 250px; overflow-y: auto; }
    .import-job-row { display: grid; grid-template-columns: minmax(0, 1fr); align-items: center; gap: 6px; padding: 7px; border: 1px solid var(--button-border); border-radius: 9px; }
    .import-job-check { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 11px; font-weight: 600; }
    .import-job-check input { margin: 0; accent-color: var(--gold-strong); }
    .import-job-schedule { width: 100%; padding: 5px; border: 1px solid var(--button-border); border-radius: 7px; background: #102a49; color: var(--text); font-size: 10px; }
    .run-selected { margin-top: 8px; }

    .icon {
      width: 18px;
      height: 18px;
      color: var(--icon);
      stroke-width: 1.7;
    }

    .label {
      min-width: 0;
      font-size: 11.5px;
      line-height: 1.2;
      font-weight: 600;
      text-align: left;
      color: var(--text);
      white-space: nowrap;
    }

    .chevron {
      width: 10px;
      height: 10px;
      color: var(--gold-strong);
      stroke-width: 2.2;
    }


    svg {
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
</style>
</head>
<body>
  <section class="group">
    <div class="group-label">End-to-end</div>
    <div class="actions">
      <button id="runE2EBtn">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="5" cy="5" r="2"></circle>
          <circle cx="19" cy="12" r="2"></circle>
          <circle cx="5" cy="19" r="2"></circle>
          <path d="M7 5h5a3 3 0 0 1 3 3v2"></path>
          <path d="M17 14v2a3 3 0 0 1-3 3H7"></path>
        </svg>
        <span class="label">Run E2E Flow</span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9 18 6-6-6-6"></path>
        </svg>
      </button>
      <button id="publishAllBtn">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 4h14v5H5z"></path>
          <path d="M7 9v11h10V9"></path>
          <path d="M9 13h6M12 10v6"></path>
        </svg>
        <span class="label">Publish All Data Feeds</span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9 18 6-6-6-6"></path>
        </svg>
      </button>
      <button id="stopE2EBtn">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="6" y="6" width="12" height="12" rx="1"></rect>
        </svg>
        <span class="label">Stop Current Flow</span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9 18 6-6-6-6"></path>
        </svg>
      </button>
    </div>
  </section>

<section class="group">
    <div class="group-label">Connections</div>
    <div class="actions">
      <button id="sourceBtn">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <ellipse cx="10" cy="5" rx="6" ry="3"></ellipse>
          <path d="M4 5v7c0 1.7 2.7 3 6 3"></path>
          <path d="M16 5v5"></path>
          <path d="M4 9c0 1.7 2.7 3 6 3"></path>
          <circle cx="17.5" cy="16.5" r="3.5"></circle>
          <path d="M17.5 14.8v3.4M15.8 16.5h3.4"></path>
        </svg>
        <span class="label">Create Source</span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9 18 6-6-6-6"></path>
        </svg>
      </button>

      <button id="destinationBtn">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10" cy="12" r="7"></circle>
          <path d="M3 12h14M10 5a11 11 0 0 1 0 14M10 5a11 11 0 0 0 0 14"></path>
          <path d="M15 17h6M18 14l3 3-3 3"></path>
        </svg>
        <span class="label">Create Destination</span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9 18 6-6-6-6"></path>
        </svg>
      </button>
    </div>
  </section>

  <section class="group">
    <div class="group-label">Imports</div>
    <div class="actions">
      <div class="import-action">
      <button class="import-job-button" id="importBtn">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9" cy="7" r="3"></circle>
          <path d="M3.5 18c.7-3.2 2.5-5 5.5-5s4.8 1.8 5.5 5"></path>
          <path d="M18 9v8M15 14l3 3 3-3"></path>
        </svg>
        <span class="label">Import Responsys Profile</span>
        <span class="schedule-indicator" id="importProfileScheduleIndicator">Next</span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
      </button>
      <select class="import-schedule-select" id="importProfileSchedule" aria-label="Import Responsys Profile schedule"><option value="-1">On-demand</option><option value="0" selected>Next hour</option><option value="1">+1 hour</option></select>
      </div>

      <button id="importJobsBtn">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"></rect><path d="M8 9h8M8 13h8M8 17h5"></path></svg>
        <span class="label">Import Jobs</span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
      </button>

    </div>
  </section>

  <section id="importJobsView">
    <div class="picker-header">
      <h1 class="picker-title">Import Jobs</h1>
      <button class="picker-back" id="importJobsBackBtn">Back</button>
    </div>
    <input class="picker-search" id="importJobSearch" type="search" placeholder="Search tables">
    <div class="picker-tools"><button id="selectAllImportsBtn">Select all</button><button id="clearImportsBtn">Clear</button></div>
    <div id="importJobList"></div>
    <select class="import-job-schedule" id="importJobSchedule" aria-label="Import Job schedule"><option value="-1">On-demand</option><option value="0" selected>Next hour</option><option value="1">+1 hour</option></select>
    <button class="run-selected" id="runSelectedImportsBtn">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 10 7-10 7z"></path></svg>
      <span class="label">Run Import Job</span>
      <span></span>
    </button>
  </section>

  <section id="exportJobsView">
    <div class="picker-header">
      <h1 class="picker-title">Export Job</h1>
      <button class="picker-back" id="exportJobsBackBtn">Back</button>
    </div>
    <div id="exportPayloadList"></div>
    <select class="import-job-schedule" id="exportJobSchedule" aria-label="Export Job schedule"><option value="-1">On-demand</option><option value="0" selected>Next hour</option><option value="1">+1 hour</option></select>
    <button class="run-selected" id="runExportJobBtn">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 10 7-10 7z"></path></svg>
      <span class="label">Run Export Job</span>
      <span></span>
    </button>
  </section>

  <section class="group">
    <div class="group-label">Export</div>
    <div class="actions">
      <button id="exportBtn">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <ellipse cx="9" cy="5" rx="5" ry="2.5"></ellipse>
          <path d="M4 5v9c0 1.4 2.2 2.5 5 2.5"></path>
          <path d="M14 5v5"></path>
          <path d="M4 9c0 1.4 2.2 2.5 5 2.5"></path>
          <path d="M15 12h6M18 9l3 3-3 3"></path>
        </svg>
        <span class="label">ExportJob</span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9 18 6-6-6-6"></path>
        </svg>
      </button>
    </div>
  </section>
  <div id="status" role="status" aria-live="polite"></div>
<script src="popup.js"></script>
</body>
</html>
